<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela MX | Tu Jugada</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">QUINIELA<span>MX</span></div>
        <nav>
            <a href="#">Partidos</a>
            <a href="#">Mi Boleto</a>
            <a href="#" class="btn-login">Ingresar</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>DEMUESTRA TU PASIÓN</h1>
                <p>Juega la jornada, arma tu quiniela y llévate el premio mayor de esta semana.</p>
                <button class="btn-primary">Jugar Ahora</button>
            </div>
        </section>

        <section class="matches-section">
            <h2>JORNADA DESTACADA</h2>
            <div class="match-grid">
                
                <article class="match-card">
                    <div class="teams">
                        <div class="team">
                            <span class="team-name">Chivas</span>
                        </div>
                        <div class="vs">VS</div>
                        <div class="team">
                            <span class="team-name">América</span>
                        </div>
                    </div>
                    <div class="odds-container">
                        <button class="btn-odd">Local <span>+120</span></button>
                        <button class="btn-odd">Empate <span>+210</span></button>
                        <button class="btn-odd">Visita <span>+150</span></button>
                    </div>
                </article>

                <article class="match-card">
                    <div class="teams">
                        <div class="team">
                            <span class="team-name">Atlas</span>
                        </div>
                        <div class="vs">VS</div>
                        <div class="team">
                            <span class="team-name">Tigres</span>
                        </div>
                    </div>
                    <div class="odds-container">
                        <button class="btn-odd">Local <span>+180</span></button>
                        <button class="btn-odd">Empate <span>+200</span></button>
                        <button class="btn-odd">Visita <span>-110</span></button>
                    </div>
                </article>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Quiniela MX. Juega de manera responsable.</p>
    </footer>

</body>
</html>
